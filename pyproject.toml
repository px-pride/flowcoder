[project]
name = "flowcoder-tk-gui"
version = "1.0.0"
description = "Tkinter GUI for FlowCoder — visual flowchart builder for automated workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flowcoder-engine>=0.1.0",
    "flowcoder-flowchart>=0.1.0",
    "pydantic>=2.0.0",
    "pygame>=2.5.0",
    "jsonschema>=4.19.0",
    "jsonpath-ng>=1.6.0",
    "asyncio-throttle>=1.0.0",
    "tkfilebrowser>=2.3.2",
]

[tool.uv.sources]
# flowcoder-engine and flowcoder-flowchart are not published to PyPI; they
# live in the engine repo under packages/. https + a pinned rev matches
# leo-axi's pyproject.toml. dcf79d6 is the commit this GUI was vendored
# from, so engine and calling code stay in step.
#
# When these are published to PyPI, delete this block — the dependencies
# entries above are already in PyPI form and need no change.
flowcoder-engine = { git = "https://github.com/px-pride/flowcoder.git", rev = "dcf79d624824f102b0f8870e784dc9960aa90c2a", subdirectory = "packages/flowcoder-engine" }
flowcoder-flowchart = { git = "https://github.com/px-pride/flowcoder.git", rev = "dcf79d624824f102b0f8870e784dc9960aa90c2a", subdirectory = "packages/flowcoder-flowchart" }

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
asyncio_mode = "auto"
markers = [
    "slow: marks tests that use real claude CLI (costs tokens, deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E203"]
