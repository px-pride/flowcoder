[project]
name = "flowcoder-tk-gui"
version = "1.0.0"
description = "Tkinter GUI for FlowCoder — visual flowchart builder for automated workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flowcoder-engine>=0.1.0",
    "flowcoder-flowchart>=0.1.0",
    "pydantic>=2.0.0",
    "pygame>=2.5.0",
    "jsonschema>=4.19.0",
    "jsonpath-ng>=1.6.0",
    "asyncio-throttle>=1.0.0",
    "tkfilebrowser>=2.3.2",
]

[tool.uv.sources]
# flowcoder-engine and flowcoder-flowchart are not published to PyPI; they
# live in the engine repo under packages/. https + a pinned rev matches
# leo-axi's pyproject.toml.
#
# Pinned to 45c078e — head of px-pride/flowcoder PR #9
# (feature/repo-separation-restacked), top of the four-PR stack
# #4 -> #6 -> #8 -> #9. The pin criterion is PROTOCOL COMPATIBILITY: from
# engine commit 0eb5807 onward, walker.py passes session_id= to
# emit_block_complete and calls emit_block_timeout, both of which the
# bridge in src/adapters/protocol_bridge.py now handles.
#
# CORRECTION to a false rationale that shipped here and in commit ad72d4a's
# message: the old pin was justified as "the commit this GUI was vendored
# from, so engine and calling code stay in step." That was vacuous — the
# GUI tree is byte-identical at dcf79d6 and 50528e0, so "vendored from"
# cannot select between revs. Protocol compatibility can, and does.
#
# PR #9 changes nothing under packages/ relative to PR #8 (verified: empty
# diff over both package dirs), so this rev carries the same engine code as
# the stack's third PR. Re-pin to the post-merge master commit once the
# stack lands; GitHub's rebase-and-merge rewrites SHAs, so this rev may not
# survive as a master ancestor unless the stack merges via merge commits.
#
# When these are published to PyPI, delete this block — the dependencies
# entries above are already in PyPI form and need no change.
flowcoder-engine = { git = "https://github.com/px-pride/flowcoder.git", rev = "45c078edd892f58aebe8b5eb314ab4cb45f19eaf", subdirectory = "packages/flowcoder-engine" }
flowcoder-flowchart = { git = "https://github.com/px-pride/flowcoder.git", rev = "45c078edd892f58aebe8b5eb314ab4cb45f19eaf", subdirectory = "packages/flowcoder-flowchart" }

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
asyncio_mode = "auto"
markers = [
    "slow: marks tests that use real claude CLI (costs tokens, deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E203"]
